        // ========== HELPER FUNCTIONS ==========
        const currentYear = new Date().getFullYear();

        function calcRemainingLife(installYear, usefulLife) {
            if (!installYear || !usefulLife) return null;
            return Math.max(0, usefulLife - (currentYear - installYear));
        }

        function calcReplaceYear(installYear, usefulLife) {
            if (!installYear || !usefulLife) return null;
            return installYear + usefulLife;
        }

        function calcRiskScore(condition, remainingLife, usefulLife) {
            if (!condition || remainingLife === null || !usefulLife) return null;
            const conditionRisk = (5 - condition) * 20;
            const lifeRisk = (1 - (remainingLife / usefulLife)) * 80;
            return Math.min(100, Math.max(0, Math.round(conditionRisk + lifeRisk)));
        }

        function getRiskLevel(score) {
            if (score === null) return { label: "N/A", class: "" };
            if (score >= 75) return { label: "Critical", class: "risk-critical" };
            if (score >= 50) return { label: "High", class: "risk-high" };
            if (score >= 25) return { label: "Medium", class: "risk-medium" };
            return { label: "Low", class: "risk-low" };
        }

        // ========== EXCEL EXPORT ==========
        function exportToExcel(assets, stats) {
            const assetPlanData = assets.map(a => ({
                "ID": a.id,
                "Asset Name": a.assetName,
                "Category": a.category,
                "Type": a.type,
                "Quantity": a.quantity || 1,
                "Location": a.location || "",
                "Install Year": a.installYear || "",
                "Useful Life (Yrs)": a.usefulLife || "",
                "Remaining Life": a.remainingLife !== null ? a.remainingLife : "",
                "Replace Year": a.replaceYear || "",
                "Condition": a.condition,
                "Condition Label": CONDITIONS.find(c => c.value === a.condition)?.label || "",
                "Priority": a.priority,
                "Unit Cost ($)": a.replacementCost || "",
                "Total Cost ($)": a.totalCost || "",
                "Risk Score": a.riskScore !== null ? a.riskScore : "",
                "Manufacturer": a.manufacturer || "",
                "Model": a.model || "",
                "Notes": a.notes || ""
            }));

            const summaryData = [
                { "Metric": "Total Assets", "Value": stats.total },
                { "Metric": "Total Replacement Value", "Value": stats.totalValue },
                { "Metric": "Average Condition", "Value": stats.avgCondition },
                { "Metric": "High Risk Assets (Score ≥50)", "Value": stats.highRisk },
                { "Metric": "Assets to Replace in 5 Years", "Value": stats.replaceIn5 },
                { "Metric": "Export Date", "Value": new Date().toLocaleDateString() }
            ];

            const categoryData = CATEGORIES.map(cat => {
                const catAssets = assets.filter(a => a.category === cat);
                const count = catAssets.reduce((s, a) => s + (a.quantity || 1), 0);
                const value = catAssets.reduce((s, a) => s + (a.totalCost || 0), 0);
                return { "Category": cat, "Asset Count": count, "Total Value ($)": value };
            }).filter(c => c["Asset Count"] > 0);

            const wb = XLSX.utils.book_new();
            const ws1 = XLSX.utils.json_to_sheet(assetPlanData);
            XLSX.utils.book_append_sheet(wb, ws1, "Asset Plan");
            const ws2 = XLSX.utils.json_to_sheet(summaryData);
            XLSX.utils.book_append_sheet(wb, ws2, "Summary");
            const ws3 = XLSX.utils.json_to_sheet(categoryData);
            XLSX.utils.book_append_sheet(wb, ws3, "By Category");

            ws1["!cols"] = [
                { wch: 10 }, { wch: 35 }, { wch: 15 }, { wch: 15 }, { wch: 8 },
                { wch: 20 }, { wch: 12 }, { wch: 15 }, { wch: 14 }, { wch: 12 },
                { wch: 10 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 },
                { wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 30 }
            ];

            const fileName = `PWS_Asset_Plan_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        function StatCard({ icon, label, value, subtitle, color }) {
            return (
                <div className="glass-card rounded-2xl p-5 shadow-lg hover-lift">
                    <div className={`w-10 h-10 ${color} rounded-lg flex items-center justify-center mb-3 text-white`}>
                        <Icon name={icon} />
                    </div>
                    <p className="text-2xl font-bold text-gray-900">{value}</p>
                    <p className="text-sm text-gray-600">{label}</p>
                    {subtitle && <p className="text-xs text-gray-400">{subtitle}</p>}
                </div>
            );
        }

        // ========== TABLE VIEW COMPONENT ==========
        function AssetTable({ assets, onEdit, onDelete }) {
            return (
                <div className="glass-card rounded-2xl overflow-hidden shadow-lg overflow-x-auto">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-gray-50 text-gray-600 border-b border-gray-200 font-bold uppercase text-xs">
                            <tr>
                                <th className="px-6 py-4">Asset Name</th>
                                <th className="px-6 py-4">Category</th>
                                <th className="px-6 py-4">Location</th>
                                <th className="px-6 py-4">Installed</th>
                                <th className="px-6 py-4">Value</th>
                                <th className="px-6 py-4 text-center">Condition</th>
                                <th className="px-6 py-4 text-center">Risk</th>
                                <th className="px-6 py-4 text-center">Priority</th>
                                <th className="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                            {assets.map(asset => {
                                const risk = getRiskLevel(asset.riskScore);
                                const condLabel = CONDITIONS.find(c => c.value === asset.condition)?.label || "N/A";
                                const condColor = asset.condition >= 4 ? "text-emerald-600" : asset.condition === 3 ? "text-amber-600" : "text-red-600";
                                
                                return (
                                    <tr key={asset.id} className="hover:bg-purple-50/50 transition-colors">
                                        <td className="px-6 py-4 font-medium text-gray-900">
                                            {asset.assetName}
                                            <div className="text-xs text-gray-400 font-normal">{asset.id}</div>
                                        </td>
                                        <td className="px-6 py-4 text-gray-600">{asset.category}</td>
                                        <td className="px-6 py-4 text-gray-600">{asset.location}</td>
                                        <td className="px-6 py-4 text-gray-600">
                                            {asset.installYear} <span className="text-gray-400">({asset.remainingLife}y left)</span>
                                        </td>
                                        <td className="px-6 py-4 font-medium text-gray-700">${asset.totalCost.toLocaleString()}</td>
                                        <td className={`px-6 py-4 text-center font-semibold ${condColor}`}>{condLabel}</td>
                                        <td className="px-6 py-4 text-center">
                                            <span className={`${risk.class} text-white text-xs font-bold px-2 py-1 rounded`}>
                                                {asset.riskScore}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4 text-center">
                                            <span className={`priority-${asset.priority.toLowerCase()} text-white text-xs font-semibold px-2 py-1 rounded`}>
                                                {asset.priority}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4 text-right">
                                            <div className="flex items-center justify-end gap-2">
                                                <button onClick={() => onEdit(asset)} className="p-2 text-purple-600 hover:bg-purple-100 rounded-lg transition-colors" title="Edit">
                                                    <Icon name="edit" size="sm" />
                                                </button>
                                                <button onClick={() => onDelete(asset.id)} className="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
                                                    <Icon name="trash" size="sm" />
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }

        // ========== MAIN APP ==========
        function App() {
            const [assets, setAssets] = useState(SAMPLE_ASSETS);
            const [view, setView] = useState("dashboard");
            const [showModal, setShowModal] = useState(false);
            const [showHelp, setShowHelp] = useState(false);
            const [editingAsset, setEditingAsset] = useState(null);
            const [search, setSearch] = useState("");
            const [filterCat, setFilterCat] = useState("All");
            const [filterPri, setFilterPri] = useState("All");

            const enrichedAssets = useMemo(() => {
                return assets.map(a => {
                    const remainingLife = calcRemainingLife(a.installYear, a.usefulLife);
                    const replaceYear = calcReplaceYear(a.installYear, a.usefulLife);
                    const riskScore = calcRiskScore(a.condition, remainingLife, a.usefulLife);
                    const totalCost = (a.replacementCost || 0) * (a.quantity || 1);
                    return { ...a, remainingLife, replaceYear, riskScore, totalCost };
                });
            }, [assets]);

            const stats = useMemo(() => {
                const total = enrichedAssets.reduce((s, a) => s + (a.quantity || 1), 0);
                const totalValue = enrichedAssets.reduce((s, a) => s + a.totalCost, 0);
                const avgCondition = enrichedAssets.length > 0
                    ? (enrichedAssets.reduce((s, a) => s + (a.condition * (a.quantity || 1)), 0) / total).toFixed(1)
                    : "0";
                const highRisk = enrichedAssets.filter(a => a.riskScore >= 50).length;
                const replaceIn5 = enrichedAssets.filter(a => a.replaceYear && a.replaceYear <= currentYear + 5).length;
                return { total, totalValue, avgCondition, highRisk, replaceIn5 };
            }, [enrichedAssets]);

            const filtered = useMemo(() => {
                return enrichedAssets.filter(a => {
                    const s = search.toLowerCase();
                    const matchSearch = a.assetName.toLowerCase().includes(s) || 
                                       (a.location || "").toLowerCase().includes(s) ||
                                       a.category.toLowerCase().includes(s);
                    const matchCat = filterCat === "All" || a.category === filterCat;
                    const matchPri = filterPri === "All" || a.priority === filterPri;
                    return matchSearch && matchCat && matchPri;
                });
            }, [enrichedAssets, search, filterCat, filterPri]);

            function saveAsset(data) {
                if (editingAsset) {
                    setAssets(prev => prev.map(a => a.id === editingAsset.id ? { ...data, id: editingAsset.id } : a));
                } else {
                    const num = assets.length + 1;
                    const newId = "AM-" + String(num).padStart(4, "0");
                    setAssets(prev => [...prev, { ...data, id: newId }]);
                }
                setShowModal(false);
                setEditingAsset(null);
            }

            function deleteAsset(id) {
                if (window.confirm("Delete this asset? This cannot be undone.")) {
                    setAssets(prev => prev.filter(a => a.id !== id));
                }
            }

            return (
                <div className="min-h-screen">
                    {/* Dark Blue Header with Custom Font & Embed Logo */}
                    <header className="header-custom shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <WRMLogo />
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setShowHelp(true)} className="p-2 hover:bg-white/10 rounded-lg text-white/90" title="Help">
                                        <Icon name="help" />
                                    </button>
                                    <button onClick={() => exportToExcel(enrichedAssets, stats)} className="flex items-center gap-2 px-3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium">
                                        <Icon name="fileSpreadsheet" size="sm" />
                                        <span className="hidden sm:inline">Export Excel</span>
                                    </button>
                                    <button onClick={() => { setEditingAsset(null); setShowModal(true); }} className="flex items-center gap-2 px-4 py-2 gold-accent text-white rounded-lg text-sm font-semibold shadow-lg">
                                        <Icon name="plus" size="sm" />
                                        <span>Add Asset</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Purple Nav Bar */}
                    <nav className="gradient-purple shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6">
                            <div className="flex gap-1 py-2 overflow-x-auto">
                                {[
                                    { id: "dashboard", label: "Dashboard", icon: "grid" },
                                    { id: "assets", label: "Assets", icon: "package" },
                                    { id: "replacement", label: "Replacement Plan", icon: "clock" },
                                    { id: "reports", label: "Reports", icon: "barchart" }
                                ].map(n => (
                                    <button key={n.id} onClick={() => setView(n.id)} className={`nav-pill flex items-center gap-2 px-4 py-2 rounded-lg text-sm whitespace-nowrap font-medium ${view === n.id ? "active" : "text-white/80 hover:text-white"}`}>
                                        <Icon name={n.icon} size="sm" />
                                        <span>{n.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
                        {view === "dashboard" && <Dashboard stats={stats} assets={enrichedAssets} onViewAssets={() => setView("assets")} />}
                        {view === "assets" && <AssetsView assets={filtered} search={search} setSearch={setSearch} filterCat={filterCat} setFilterCat={setFilterCat} filterPri={filterPri} setFilterPri={setFilterPri} onEdit={a => { setEditingAsset(a); setShowModal(true); }} onDelete={deleteAsset} />}
                        {view === "replacement" && <ReplacementView assets={enrichedAssets} />}
                        {view === "reports" && <ReportsView assets={enrichedAssets} stats={stats} />}
                    </main>

                    {showModal && <AssetModal asset={editingAsset} onSave={saveAsset} onClose={() => { setShowModal(false); setEditingAsset(null); }} />}
                    {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
                    
                    <footer className="text-center text-xs text-gray-400 pb-6 pt-2">
                        <div className="mb-1">
                             <a href="https://www.canva.com/design/DAG7DT72h_8/UnZD5Fp0oPssvN24Wu1MRQ/view?utm_content=DAG7DT72h_8&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener" className="hover:underline">Design</a> by Stephen Moffitt
                        </div>
                    </footer>
                </div>
            );
        }

        // ========== DASHBOARD ==========
        function Dashboard({ stats, assets, onViewAssets }) {
            const highRiskAssets = useMemo(() => 
                assets.filter(a => a.riskScore >= 50).sort((a, b) => b.riskScore - a.riskScore).slice(0, 5)
            , [assets]);

            const upcomingReplacements = useMemo(() =>
                assets.filter(a => a.replaceYear && a.replaceYear <= currentYear + 5)
                      .sort((a, b) => a.replaceYear - b.replaceYear).slice(0, 5)
            , [assets]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="glass-card rounded-2xl p-6 shadow-lg">
                        <h2 className="text-2xl font-bold text-gray-900 mb-2">💧 PWS Asset Management</h2>
                        <p className="text-gray-600">Track, manage, and plan your water system infrastructure. Assets auto-populate from a standard catalog with expected lifespans and replacement costs.</p>
                        <button onClick={onViewAssets} className="mt-4 px-5 py-2 gradient-purple text-white rounded-lg font-medium hover-lift">View All Assets</button>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard icon="package" label="Total Assets" value={stats.total} color="bg-purple-600" />
                        <StatCard icon="dollar" label="Total Value" value={"$" + (stats.totalValue / 1000).toFixed(0) + "K"} color="bg-emerald-500" />
                        <StatCard icon="alert" label="High Risk" value={stats.highRisk} subtitle="score ≥50" color="bg-red-500" />
                        <StatCard icon="clock" label="Replace in 5yr" value={stats.replaceIn5} color="bg-amber-500" />
                    </div>

                    <div className="grid lg:grid-cols-2 gap-6">
                        <div className="glass-card rounded-2xl p-6 shadow-lg">
                            <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                <span className="text-red-500"><Icon name="alert" /></span> <span>Highest Risk Assets</span>
                            </h3>
                            {highRiskAssets.length > 0 ? (
                                <div className="space-y-3">
                                    {highRiskAssets.map(a => {
                                        const risk = getRiskLevel(a.riskScore);
                                        return (
                                            <div key={a.id} className="p-3 rounded-lg bg-red-50 border border-red-200">
                                                <div className="flex justify-between items-center">
                                                    <div>
                                                        <p className="font-semibold text-gray-900">{a.assetName}</p>
                                                        <p className="text-sm text-gray-500">{a.location} • {a.category}</p>
                                                    </div>
                                                    <span className={`${risk.class} text-white text-xs font-bold px-2 py-1 rounded`}>{a.riskScore}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : <p className="text-gray-500 text-center py-6">No high-risk assets</p>}
                        </div>

                        <div className="glass-card rounded-2xl p-6 shadow-lg">
                            <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                <span className="text-amber-500"><Icon name="clock" /></span> <span>Upcoming Replacements</span>
                            </h3>
                            {upcomingReplacements.length > 0 ? (
                                <div className="space-y-3">
                                    {upcomingReplacements.map(a => (
                                        <div key={a.id} className={`p-3 rounded-lg border-l-4 ${a.replaceYear <= currentYear ? "bg-red-50 border-red-500" : a.replaceYear <= currentYear + 2 ? "bg-amber-50 border-amber-500" : "bg-gray-50 border-gray-300"}`}>
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <p className="font-semibold text-gray-900">{a.assetName}</p>
                                                    <p className="text-sm text-gray-500">${a.totalCost.toLocaleString()} est. cost</p>
                                                </div>
                                                <p className={`font-bold ${a.replaceYear <= currentYear ? "text-red-600" : "text-gray-700"}`}>{a.replaceYear}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : <p className="text-gray-500 text-center py-6">No replacements due within 5 years</p>}
                        </div>
                    </div>

                    <div className="glass-card rounded-2xl p-6 shadow-lg">
                        <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                            <span className="text-purple-600"><Icon name="layers" /></span> <span>Assets by Category</span>
                        </h3>
                        <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                            {CATEGORIES.map(cat => {
                                const catAssets = assets.filter(a => a.category === cat);
                                const count = catAssets.reduce((s, a) => s + (a.quantity || 1), 0);
                                const value = catAssets.reduce((s, a) => s + a.totalCost, 0);
                                return (
                                    <div key={cat} className="p-3 rounded-xl bg-gray-50 hover:bg-purple-50 transition text-center">
                                        <p className="text-2xl font-bold text-gray-900">{count}</p>
                                        <p className="text-xs text-gray-600 truncate">{cat}</p>
                                        <p className="text-xs text-gray-400">${(value/1000).toFixed(0)}K</p>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ========== ASSETS VIEW ==========
        function AssetsView({ assets, search, setSearch, filterCat, setFilterCat, filterPri, setFilterPri, onEdit, onDelete }) {
            const [isGridView, setIsGridView] = useState(true);

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Filter & Toggle Bar */}
                    <div className="glass-card rounded-2xl p-4 shadow-lg">
                        <div className="flex flex-col xl:flex-row gap-4 justify-between">
                            {/* Search & Filters */}
                            <div className="flex flex-col sm:flex-row gap-3 flex-1">
                                <div className="flex-1 relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                        <Icon name="search" size="sm" />
                                    </div>
                                    <input type="text" placeholder="Search assets..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:border-purple-500 transition-colors" />
                                </div>
                                <select value={filterCat} onChange={e => setFilterCat(e.target.value)} className="px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm">
                                    <option value="All">All Categories</option>
                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <select value={filterPri} onChange={e => setFilterPri(e.target.value)} className="px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm">
                                    <option value="All">All Priorities</option>
                                    {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>

                            {/* View Toggles */}
                            <div className="flex bg-gray-100 p-1 rounded-lg self-start sm:self-auto">
                                <button 
                                    onClick={() => setIsGridView(true)} 
                                    className={`p-2 rounded-md flex items-center gap-2 text-sm font-medium transition-all ${isGridView ? 'bg-white text-purple-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <Icon name="grid" size="sm" /> <span className="hidden sm:inline">Grid</span>
                                </button>
                                <button 
                                    onClick={() => setIsGridView(false)} 
                                    className={`p-2 rounded-md flex items-center gap-2 text-sm font-medium transition-all ${!isGridView ? 'bg-white text-purple-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <Icon name="list" size="sm" /> <span className="hidden sm:inline">List</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Content Area */}
                    {assets.length > 0 ? (
                        <>
                            {isGridView ? (
                                <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
                                    {assets.map(asset => <AssetCard key={asset.id} asset={asset} onEdit={onEdit} onDelete={onDelete} />)}
                                </div>
                            ) : (
                                <AssetTable assets={assets} onEdit={onEdit} onDelete={onDelete} />
                            )}
                        </>
                    ) : (
                        <div className="glass-card rounded-2xl p-12 text-center shadow-lg">
                            <div className="text-gray-300 mb-2"><Icon name="package" size="lg" /></div>
                            <p className="text-gray-500">No assets found</p>
                        </div>
                    )}
                </div>
            );
        }

        function AssetCard({ asset, onEdit, onDelete }) {
            const condLabel = CONDITIONS.find(c => c.value === asset.condition)?.label || "N/A";
            const risk = getRiskLevel(asset.riskScore);
            const condColor = asset.condition >= 4 ? "text-emerald-600" : asset.condition === 3 ? "text-amber-600" : "text-red-600";

            return (
                <div className="glass-card rounded-xl overflow-hidden shadow-lg hover-lift">
                    <div className="gradient-purple p-4">
                        <div className="flex items-start justify-between gap-2">
                            <div className="min-w-0">
                                <h3 className="font-bold text-white truncate">{asset.assetName}</h3>
                                <p className="text-purple-200 text-sm">{asset.id} • Qty: {asset.quantity || 1}</p>
                            </div>
                            <span className={`priority-${asset.priority.toLowerCase()} text-white text-xs font-semibold px-2 py-1 rounded shrink-0`}>{asset.priority}</span>
                        </div>
                    </div>
                    <div className="p-4 space-y-2 text-sm">
                        <div className="flex items-center gap-2 text-gray-600">
                            <Icon name="layers" size="sm" /><span>{asset.category} • {asset.type}</span>
                        </div>
                        <div className="flex items-center gap-2 text-gray-600">
                            <Icon name="mappin" size="sm" /><span>{asset.location || "No location"}</span>
                        </div>
                        <div className="flex items-center gap-2 text-gray-600">
                            <Icon name="calendar" size="sm" /><span>Installed {asset.installYear || "N/A"} • {asset.remainingLife !== null ? asset.remainingLife + " yrs left" : "N/A"}</span>
                        </div>
                        <div className="flex items-center gap-2 text-gray-600">
                            <Icon name="dollar" size="sm" /><span>${asset.totalCost.toLocaleString()} total value</span>
                        </div>
                        <div className="flex justify-between items-center pt-1">
                            <div>
                                <span className="text-gray-500">Condition:</span> <span className={`font-semibold ${condColor}`}>{condLabel}</span>
                            </div>
                            <div>
                                <span className="text-gray-500">Risk:</span> <span className={`${risk.class} text-white text-xs font-bold px-2 py-0.5 rounded ml-1`}>{asset.riskScore ?? "N/A"}</span>
                            </div>
                        </div>
                        <div className="flex gap-2 pt-2">
                            <button onClick={() => onEdit(asset)} className="flex-1 flex items-center justify-center gap-1 px-3 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm font-medium">
                                <Icon name="edit" size="sm" /><span>Edit</span>
                            </button>
                            <button onClick={() => onDelete(asset.id)} className="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-red-50 hover:text-red-600">
                                <Icon name="trash" size="sm" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ========== REPLACEMENT VIEW ==========
        function ReplacementView({ assets }) {
            const byYear = useMemo(() => {
                const years = {};
                assets.forEach(a => {
                    if (a.replaceYear) {
                        if (!years[a.replaceYear]) years[a.replaceYear] = [];
                        years[a.replaceYear].push(a);
                    }
                });
                return Object.entries(years).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
            }, [assets]);

            const fiveYearCost = useMemo(() => {
                return assets.filter(a => a.replaceYear && a.replaceYear <= currentYear + 5)
                             .reduce((s, a) => s + a.totalCost, 0);
            }, [assets]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="glass-card rounded-2xl p-6 shadow-lg">
                        <h2 className="text-2xl font-bold text-gray-900 mb-2">📅 Replacement Plan</h2>
                        <p className="text-gray-600">Assets organized by expected replacement year based on install date + useful life.</p>
                        <div className="mt-4 p-4 bg-amber-50 rounded-lg border border-amber-200">
                            <p className="text-amber-800 font-semibold">5-Year Capital Need: <span className="text-2xl">${fiveYearCost.toLocaleString()}</span></p>
                        </div>
                    </div>

                    {byYear.map(([year, yearAssets]) => {
                        const yearTotal = yearAssets.reduce((s, a) => s + a.totalCost, 0);
                        const isPast = parseInt(year) <= currentYear;
                        return (
                            <div key={year} className="glass-card rounded-2xl p-6 shadow-lg">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className={`text-lg font-bold ${isPast ? "text-red-600" : "text-gray-900"}`}>
                                        {isPast ? "⚠️ " : ""}{year} {isPast && "(Overdue)"}
                                    </h3>
                                    <span className="font-bold text-gray-700">${yearTotal.toLocaleString()}</span>
                                </div>
                                <div className="space-y-2">
                                    {yearAssets.map(a => (
                                        <div key={a.id} className={`p-3 rounded-lg ${isPast ? "bg-red-50" : "bg-gray-50"} flex justify-between items-center`}>
                                            <div>
                                                <p className="font-medium text-gray-900">{a.assetName}</p>
                                                <p className="text-sm text-gray-500">{a.location} • {a.category}</p>
                                            </div>
                                            <p className="font-semibold text-gray-700">${a.totalCost.toLocaleString()}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );
                    })}

                    {byYear.length === 0 && (
                        <div className="glass-card rounded-2xl p-12 text-center shadow-lg">
                            <div className="text-gray-300 mb-2"><Icon name="calendar" size="lg" /></div>
                            <p className="text-gray-500">No replacement dates calculated. Add install years to your assets.</p>
                        </div>
                    )}
                </div>
            );
        }

        // ========== REPORTS VIEW ==========
        function ReportsView({ assets, stats }) {
            const byCategory = useMemo(() => {
                return CATEGORIES.map(cat => {
                    const catAssets = assets.filter(a => a.category === cat);
                    return {
                        category: cat,
                        count: catAssets.reduce((s, a) => s + (a.quantity || 1), 0),
                        value: catAssets.reduce((s, a) => s + a.totalCost, 0),
                        avgCondition: catAssets.length > 0 ? (catAssets.reduce((s, a) => s + a.condition, 0) / catAssets.length).toFixed(1) : "-"
                    };
                }).filter(c => c.count > 0);
            }, [assets]);

            const byPriority = useMemo(() => {
                return PRIORITIES.map(pri => {
                    const priAssets = assets.filter(a => a.priority === pri);
                    return {
                        priority: pri,
                        count: priAssets.reduce((s, a) => s + (a.quantity || 1), 0),
                        value: priAssets.reduce((s, a) => s + a.totalCost, 0)
                    };
                }).filter(p => p.count > 0);
            }, [assets]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="glass-card rounded-2xl p-6 shadow-lg">
                        <h2 className="text-2xl font-bold text-gray-900 mb-2">📊 Asset Reports</h2>
                        <p className="text-gray-600">Summary of your water system infrastructure.</p>
                    </div>

                    <div className="grid md:grid-cols-4 gap-4">
                        <div className="glass-card rounded-2xl p-6 shadow-lg text-center">
                            <p className="text-3xl font-bold text-purple-600">{stats.total}</p>
                            <p className="text-gray-600">Total Assets</p>
                        </div>
                        <div className="glass-card rounded-2xl p-6 shadow-lg text-center">
                            <p className="text-3xl font-bold text-emerald-600">${(stats.totalValue / 1000).toFixed(0)}K</p>
                            <p className="text-gray-600">Total Value</p>
                        </div>
                        <div className="glass-card rounded-2xl p-6 shadow-lg text-center">
                            <p className="text-3xl font-bold text-amber-600">{stats.avgCondition}</p>
                            <p className="text-gray-600">Avg Condition</p>
                        </div>
                        <div className="glass-card rounded-2xl p-6 shadow-lg text-center">
                            <p className="text-3xl font-bold text-red-600">{stats.highRisk}</p>
                            <p className="text-gray-600">High Risk</p>
                        </div>
                    </div>

                    <div className="glass-card rounded-2xl p-6 shadow-lg overflow-x-auto">
                        <h3 className="text-lg font-bold text-gray-900 mb-4">By Category</h3>
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left border-b border-gray-200">
                                    <th className="pb-3 font-semibold text-gray-600">Category</th>
                                    <th className="pb-3 font-semibold text-gray-600 text-right">Count</th>
                                    <th className="pb-3 font-semibold text-gray-600 text-right">Total Value</th>
                                    <th className="pb-3 font-semibold text-gray-600 text-right">Avg Condition</th>
                                </tr>
                            </thead>
                            <tbody>
                                {byCategory.map(row => (
                                    <tr key={row.category} className="border-b border-gray-100">
                                        <td className="py-3 text-gray-900">{row.category}</td>
                                        <td className="py-3 text-right text-gray-700">{row.count}</td>
                                        <td className="py-3 text-right text-gray-700">${row.value.toLocaleString()}</td>
                                        <td className="py-3 text-right text-gray-700">{row.avgCondition}</td>
                                    </tr>
                                ))}
                            </tbody>
                            <tfoot>
                                <tr className="bg-gray-50 font-bold">
                                    <td className="py-3 text-gray-900">Total</td>
                                    <td className="py-3 text-right text-gray-900">{stats.total}</td>
                                    <td className="py-3 text-right text-gray-900">${stats.totalValue.toLocaleString()}</td>
                                    <td className="py-3 text-right text-gray-900">{stats.avgCondition}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <div className="glass-card rounded-2xl p-6 shadow-lg overflow-x-auto">
                        <h3 className="text-lg font-bold text-gray-900 mb-4">By Priority</h3>
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left border-b border-gray-200">
                                    <th className="pb-3 font-semibold text-gray-600">Priority</th>
                                    <th className="pb-3 font-semibold text-gray-600 text-right">Count</th>
                                    <th className="pb-3 font-semibold text-gray-600 text-right">Total Value</th>
                                </tr>
                            </thead>
                            <tbody>
                                {byPriority.map(row => (
                                    <tr key={row.priority} className="border-b border-gray-100">
                                        <td className="py-3"><span className={`priority-${row.priority.toLowerCase()} text-white text-xs font-semibold px-2 py-1 rounded`}>{row.priority}</span></td>
                                        <td className="py-3 text-right text-gray-700">{row.count}</td>
                                        <td className="py-3 text-right text-gray-700">${row.value.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ========== ASSET MODAL ==========
        function AssetModal({ asset, onSave, onClose }) {
            const [form, setForm] = useState(() => {
                if (asset) return { ...asset };
                return {
                    assetName: "",
                    category: "Intake",
                    type: "",
                    quantity: 1,
                    location: "",
                    installYear: "",
                    usefulLife: "",
                    condition: 3,
                    priority: "Medium",
                    replacementCost: "",
                    manufacturer: "",
                    model: "",
                    notes: ""
                };
            });

            const catalogItemsForCategory = useMemo(() => {
                return ASSET_CATALOG.filter(c => c.category === form.category);
            }, [form.category]);

            function handleAssetSelect(itemName) {
                const catalogItem = ASSET_CATALOG.find(c => c.item === itemName);
                if (catalogItem) {
                    setForm(prev => ({
                        ...prev,
                        assetName: catalogItem.item,
                        category: catalogItem.category,
                        type: catalogItem.type,
                        usefulLife: catalogItem.expectedLife,
                        replacementCost: catalogItem.estimatedPrice
                    }));
                }
            }

            function handleCategoryChange(cat) {
                setForm(prev => ({ ...prev, category: cat, assetName: "", type: "", usefulLife: "", replacementCost: "" }));
            }

            function handleSubmit(e) {
                e.preventDefault();
                const data = {
                    ...form,
                    quantity: parseInt(form.quantity, 10) || 1,
                    installYear: form.installYear ? parseInt(form.installYear, 10) : null,
                    usefulLife: form.usefulLife ? parseInt(form.usefulLife, 10) : null,
                    condition: parseInt(form.condition, 10),
                    replacementCost: form.replacementCost ? parseInt(form.replacementCost, 10) : null
                };
                onSave(data);
            }

            return (
                <div className="fixed inset-0 bg-black/50 modal-overlay flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden">
                        <div className="gradient-purple p-5 flex items-center justify-between">
                            <h2 className="text-lg font-bold text-white">{asset ? "Edit Asset" : "Add Asset"}</h2>
                            <button onClick={onClose} className="text-white/80 hover:text-white p-1 rounded">
                                <Icon name="x" />
                            </button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-5 overflow-y-auto max-h-[calc(90vh-80px)] space-y-4">
                            <div className="p-3 bg-purple-50 rounded-lg border border-purple-200 text-sm text-purple-800">
                                <strong>💡 Tip:</strong> Select a category, then pick an asset from the catalog to auto-fill expected life and cost.
                            </div>

                            <div className="grid sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Category *</label>
                                    <select required value={form.category} onChange={e => handleCategoryChange(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm">
                                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Select from Catalog</label>
                                    <select value={form.assetName} onChange={e => handleAssetSelect(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm">
                                        <option value="">-- Select Asset --</option>
                                        {catalogItemsForCategory.map(c => <option key={c.item} value={c.item}>{c.item}</option>)}
                                    </select>
                                </div>
                                <div className="sm:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Asset Name *</label>
                                    <input type="text" required value={form.assetName} onChange={e => setForm({...form, assetName: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="Or type custom name" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Type</label>
                                    <input type="text" value={form.type} onChange={e => setForm({...form, type: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                                    <input type="number" min="1" value={form.quantity} onChange={e => setForm({...form, quantity: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                                </div>
                                <div className="sm:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Location</label>
                                    <input type="text" value={form.location} onChange={e => setForm({...form, location: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="e.g., Treatment Plant, Well Site #1" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Install Year</label>
                                    <input type="number" min="1900" max="2030" value={form.installYear} onChange={e => setForm({...form, installYear: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="2020" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Useful Life (Years)</label>
                                    <input type="number" value={form.usefulLife} onChange={e => setForm({...form, usefulLife: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Replacement Cost ($)</label>
                                    <input type="number" value={form.replacementCost} onChange={e => setForm({...form, replacementCost: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Priority *</label>
                                    <select value={form.priority} onChange={e => setForm({...form, priority: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm">
                                        {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Condition *</label>
                                    <select value={form.condition} onChange={e => setForm({...form, condition: parseInt(e.target.value, 10)})} className="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm">
                                        {CONDITIONS.map(c => <option key={c.value} value={c.value}>{c.value} - {c.label}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Manufacturer</label>
                                    <input type="text" value={form.manufacturer} onChange={e => setForm({...form, manufacturer: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Model</label>
                                    <input type="text" value={form.model} onChange={e => setForm({...form, model: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                                </div>
                                <div className="sm:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                                    <textarea value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} rows={2} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="Additional details..." />
                                </div>
                            </div>

                            <div className="flex gap-3 pt-2">
                                <button type="submit" className="flex-1 px-5 py-2.5 gold-accent text-white rounded-lg font-semibold">{asset ? "Update Asset" : "Add Asset"}</button>
                                <button type="button" onClick={onClose} className="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ========== HELP MODAL ==========
        function HelpModal({ onClose }) {
            return (
                <div className="fixed inset-0 bg-black/50 modal-overlay flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] overflow-hidden">
                        <div className="gradient-purple p-5 flex items-center justify-between">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <Icon name="help" /><span>Getting Started</span>
                            </h2>
                            <button onClick={onClose} className="text-white/80 hover:text-white p-1 rounded">
                                <Icon name="x" />
                            </button>
                        </div>
                        <div className="p-5 overflow-y-auto max-h-[calc(90vh-80px)] space-y-5 text-sm">
                            <div>
                                <h3 className="font-bold text-gray-900 mb-2">🚀 Quick Start</h3>
                                <ol className="list-decimal list-inside text-gray-600 space-y-1">
                                    <li>Click <strong>Add Asset</strong> to enter your equipment</li>
                                    <li>Select a <strong>Category</strong>, then pick from the <strong>Catalog</strong></li>
                                    <li>Expected life & cost auto-populate from industry standards</li>
                                    <li>Add install year, location, and condition</li>
                                    <li>View your <strong>Replacement Plan</strong> to see capital needs</li>
                                    <li>Click <strong>Export Excel</strong> to download your asset plan</li>
                                </ol>
                            </div>
                            <div>
                                <h3 className="font-bold text-gray-900 mb-2">📦 Asset Categories</h3>
                                <ul className="text-gray-600 space-y-1">
                                    <li>• <strong>Intake:</strong> Raw pumps, screens, valves</li>
                                    <li>• <strong>Treatment:</strong> Chlorinators, filters, SCADA</li>
                                    <li>• <strong>Storage:</strong> Ground tanks, elevated tanks, standpipes</li>
                                    <li>• <strong>Distribution:</strong> Booster pumps, valves, hydrants, meters</li>
                                    <li>• <strong>Wells:</strong> Well pumps, casings, houses</li>
                                    <li>• <strong>Power/Emergency:</strong> Generators, transfer switches, VFDs</li>
                                    <li>• <strong>Machinery:</strong> Trucks, equipment, mowers</li>
                                    <li>• <strong>Buildings:</strong> Treatment plants, pump houses</li>
                                </ul>
                            </div>
                            <div>
                                <h3 className="font-bold text-gray-900 mb-2">📊 Auto-Calculations</h3>
                                <ul className="text-gray-600 space-y-1">
                                    <li>• <strong>Remaining Life:</strong> Useful Life - Age</li>
                                    <li>• <strong>Replace Year:</strong> Install Year + Useful Life</li>
                                    <li>• <strong>Risk Score:</strong> Based on condition + remaining life (0-100)</li>
                                    <li>• <strong>Total Value:</strong> Unit Cost × Quantity</li>
                                </ul>
                            </div>
                            <div className="p-3 bg-purple-50 rounded-lg border border-purple-200">
                                <p className="text-purple-800"><strong>Sample data included</strong> – Edit or delete the example assets to get started with your own inventory.</p>
                            </div>
                            <button onClick={onClose} className="w-full px-5 py-2.5 gradient-purple text-white rounded-lg font-semibold">Got It!</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ========== RENDER ==========
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
